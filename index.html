<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRINDADE MOTO-TÁXI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    color: #222;
}

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 25px 15px;
    border-bottom: 5px solid #d40000;
}

.logo {
    font-size: 55px;
}

header h1 {
    margin: 8px 0;
    font-size: 27px;
}

header p {
    margin: 5px 0;
}

main {
    max-width: 600px;
    margin: auto;
    padding: 15px;
}

section {
    background: white;
    padding: 20px;
    margin-bottom: 18px;
    border-radius: 14px;
    box-shadow: 0 3px 12px #0002;
}

h2 {
    color: #d40000;
    text-align: center;
    margin-top: 0;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 12px;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    background: white;
}

input:focus,
select:focus,
textarea:focus {
    outline: none;
    border-color: #d40000;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

button,
.link-button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: block;
}

.ligar {
    background: #d40000;
    color: white;
}

.ligar:hover {
    background: #a80000;
}

.whatsapp {
    background: #20c45a;
    color: white;
}

.sms {
    background: #111;
    color: white;
}

.gps {
    background: #d40000;
    color: white;
}

.secundario {
    background: #555;
    color: white;
}

.servicos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.servico {
    border: 3px solid #ddd;
    background: #fafafa;
    border-radius: 12px;
    padding: 20px 10px;
    text-align: center;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
}

.servico.ativo {
    border-color: #d40000;
    background: #fff0f0;
}

.servico .icone {
    font-size: 40px;
    display: block;
    margin-bottom: 8px;
}

.tipo-escolhido {
    text-align: center;
    font-weight: bold;
    color: #d40000;
    margin-top: 15px;
}

.disponivel {
    color: green;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

.indisponivel {
    color: #d40000;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

.agendamento {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

#resultadoLocalizacao {
    text-align: center;
    line-height: 1.6;
}

.preco {
    background: #111;
    color: white;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    margin-top: 15px;
}

.preco strong {
    color: #ff3333;
    font-size: 22px;
}

.confirmacao {
    display: none;
    background: #e9ffe9;
    border: 2px solid green;
    color: #064d06;
}

footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 25px 15px;
    border-top: 5px solid #d40000;
}

footer h3 {
    color: #d40000;
}

.hidden {
    display: none;
}

@media (max-width: 450px) {
    .servicos,
    .agendamento {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">🏍️</div>

    <h1>TRINDADE MOTO-TÁXI</h1>

    <p>Transporte rápido, seguro e confiável</p>

    <p>📍 Cuito — Província do Bié</p>

</header>

<main>

    <p>
        Bem-vindo à <strong>TRINDADE MOTO-TÁXI</strong>.
        Escolha o serviço que deseja e faça o seu pedido
        de forma rápida.
    </p>

    <a

        class="link-button ligar">
        📞 LIGAR AGORA
    </a>

</section>


<!-- DISPONIBILIDADE -->

<section>

    <h2>Estado do serviço</h2>

    <p
        id="statusDisponibilidade"
        class="disponivel">
        🟢 DISPONÍVEL
    </p>

</section>
