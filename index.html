<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRINDADE MOTO-TÁXI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    color: #222;
}

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 25px 15px;
    border-bottom: 5px solid #d40000;
}

.logo {
    font-size: 55px;
}

header h1 {
    margin: 8px 0;
    font-size: 27px;
}

header p {
    margin: 5px 0;
}

.container {
    max-width: 600px;
    margin: 20px auto;
    padding: 0 15px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
}

h2 {
    text-align: center;
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

textarea {
    resize: vertical;
    min-height: 80px;
}

.modos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

.modo {
    border: 2px solid #ccc;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    cursor: pointer;
    background: #fafafa;
}

.modo input {
    display: none;
}

.modo.ativo {
    border-color: #d40000;
    background: #ffeaea;
}

.modo strong {
    display: block;
    font-size: 17px;
}

.botao {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    background: #d40000;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.botao:hover {
    background: #a80000;
}

.ligar {
    display: block;
    text-align: center;
    margin-top: 12px;
    padding: 14px;
    border-radius: 8px;
    background: #111;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 20px;
    margin-top: 25px;
    background: #111;
    color: white;
    font-size: 14px;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<header>

    <div class="logo">🏍️</div>

    <h1>TRINDADE MOTO-TÁXI</h1>

    <p>Cuito - Província do Bié</p>

    <p>Transporte rápido, seguro e confiável</p>

</header>

<div class="container">

    <div class="card">

        <h2>Fazer Pedido</h2>

        <form id="formPedido">

            <label for="nome">Nome</label>

            <input
                type="text"
                id="nome"
                placeholder="Digite o seu nome"
                required
            >

            <label for="telefone">Telefone</label>

            <input
                type="tel"
                id="telefone"
                placeholder="Ex: 944902791"
                required
            >

            <label>Escolha o serviço</label>

            <div class="modos">

                <label class="modo ativo" id="modoTaxi">

                    <input
                        type="radio"
                        name="servico"
                        value="Taxi"
                        checked
                    >

                    <strong>🏍️ Moto-Táxi</strong>

                    <span>Deslocação de pessoa</span>

                </label>

                <label class="modo" id="modoEncomenda">

                    <input
                        type="radio"
                        name="servico"
                        value="Encomenda"
                    >

                    <strong>📦 Encomenda</strong>

                    <span>Entrega de produtos</span>

                </label>

            </div>

            <label for="origem">Local de partida</label>

            <input
                type="text"
                id="origem"
                placeholder="Onde devemos buscar?"
                required
            >

            <label for="destino">Destino</label>

            <input
                type="text"
                id="destino"
                placeholder="Para onde vai?"
                required
            >

            <div id="dadosEncomenda" class="hidden">

                <label for="descricao">
                    Descrição da encomenda
                </label>

                <textarea
                    id="descricao"
                    placeholder="Descreva a encomenda"
                ></textarea>

            </div>

            <label for="observacao">
                Observação
            </label>

            <textarea
                id="observacao"
                placeholder="Alguma informação adicional?"
            ></textarea>

            <button type="submit" class="botao">
                📲 Fazer Pedido
            </button>

        </form>

        <a
            href="tel:+244944902791"
            class="ligar"
        >
            📞 Ligar para TRINDADE
        </a>

    </div>

</div>

<footer>

    © 2026 TRINDADE MOTO-TÁXI<br>

    Cuito - Província do Bié

</footer>

<script>

const modoTaxi =
    document.getElementById("modoTaxi");

const modoEncomenda =
    document.getElementById("modoEncomenda");

const dadosEncomenda =
    document.getElementById("dadosEncomenda");


const radios =
    document.querySelectorAll(
        'input[name="servico"]'
    );


radios.forEach(function(radio) {

    radio.addEventListener("change", function() {

        modoTaxi.classList.remove("ativo");

        modoEncomenda.classList.remove("ativo");


        if (this.value === "Taxi") {

            modoTaxi.classList.add("ativo");

            dadosEncomenda.classList.add("hidden");

        } else {

            modoEncomenda.classList.add("ativo");

            dadosEncomenda.classList.remove("hidden");

        }

    });

});


document
.getElementById("formPedido")
.addEventListener("submit", function(event) {

    event.preventDefault();


    const nome =
        document.getElementById("nome").value.trim();

    const telefone =
        document.getElementById("telefone").value.trim();

    const origem =
        document.getElementById("origem").value.trim();

    const destino =
        document.getElementById("destino").value.trim();

    const observacao =
        document.getElementById("observacao").value.trim();

    const servico =
        document.querySelector(
            'input[name="servico"]:checked'
        ).value;

    const descricao =
        document.getElementById("descricao").value.trim();


    let mensagem =
        "🏍️ *TRINDADE MOTO-TÁXI*%0A%0A" +

        "👤 Nome: " + nome + "%0A" +

        "📞 Telefone: " + telefone + "%0A" +

        "🛵 Serviço: " + servico + "%0A" +

        "📍 Origem: " + origem + "%0A" +

        "📍 Destino: " + destino + "%0A";


    if (servico === "Encomenda") {

        mensagem +=
            "📦 Encomenda: " +
            descricao +
            "%0A";

    }


    mensagem +=
        "📝 Observação: " +
        observacao;


    const numeroWhatsApp =
        "244944902791";


    const url =
        "https://wa.me/" +
        numeroWhatsApp +
        "?text=" +
        mensagem;


    window.open(url, "_blank");

});

</script>

</body>
</html>
